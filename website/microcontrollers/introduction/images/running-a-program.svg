<svg xmlns="http://www.w3.org/2000/svg" width="780" height="250" viewBox="0 0 780 250" role="img" aria-label="Two steps. First, a computer copies a program to the board over a USB cable. Second, the board, powered by a charger and with no computer, runs the program and lights an LED." font-family="'IBM Plex Sans', system-ui, sans-serif">
