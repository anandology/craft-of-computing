<svg xmlns="http://www.w3.org/2000/svg" width="460" height="660" viewBox="0 0 460 660" role="img" aria-label="Side view of an LED: a red dome on a rim, with two legs. The left leg is longer: it is the anode, +. The right leg is shorter: it is the cathode, −. Below, the circuit symbol for an LED: a triangle pointing to a bar, with two arrows for the light, + on the triangle side and − on the bar side." font-family="'IBM Plex Sans', system-ui, sans-serif">
<rect x="0.5" y="0.5" width="459" height="659" rx="8" fill="#F5F1E8" stroke="#DFD8C8"/>
<!-- legs -->
<line x1="205" y1="252" x2="205" y2="480" stroke="#8C9096" stroke-width="5" stroke-linecap="round"/>
<line x1="255" y1="252" x2="255" y2="400" stroke="#8C9096" stroke-width="5" stroke-linecap="round"/>
<!-- inside: anode post and cathode anvil -->
<line x1="205" y1="238" x2="205" y2="150" stroke="#9E3328" stroke-width="3"/>
<line x1="255" y1="238" x2="255" y2="170" stroke="#9E3328" stroke-width="3"/>
<path d="M240 170 H262 L252 150 H240 Z" fill="#9E3328"/>
<!-- body -->
<path d="M180 238 V130 A50 50 0 0 1 280 130 V238 Z" fill="#E8574A" fill-opacity="0.85" stroke="#9E3328" stroke-width="2"/>
<!-- rim -->
<rect x="168" y="238" width="124" height="14" fill="#E8574A" stroke="#9E3328" stroke-width="2"/>
<!-- labels -->
<text x="190" y="455" font-size="22" fill="#1A1916" font-weight="600" text-anchor="end">Anode (+)</text>
<text x="190" y="480" font-size="17" fill="#8A8270" text-anchor="end">longer leg</text>
<text x="270" y="375" font-size="22" fill="#1A1916" font-weight="600">Cathode (−)</text>
<text x="270" y="400" font-size="17" fill="#8A8270">shorter leg</text>
<!-- symbol -->
<line x1="24" y1="520" x2="436" y2="520" stroke="#DFD8C8" stroke-width="1.5"/>
<text x="24" y="550" font-size="14" letter-spacing="1.5" fill="#8A8270">SYMBOL</text>
<g stroke="#1A1916" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
<line x1="150" y1="600" x2="205" y2="600"/>
<path d="M205 578 L205 622 L245 600 Z" fill="#1A1916"/>
<line x1="245" y1="578" x2="245" y2="622"/>
<line x1="245" y1="600" x2="310" y2="600"/>
<line x1="232" y1="572" x2="250" y2="554"/>
<line x1="246" y1="580" x2="264" y2="562"/>
</g>
<path d="M254 550 L243 553 L251 561 Z" fill="#1A1916"/>
<path d="M268 558 L257 561 L265 569 Z" fill="#1A1916"/>
<text x="138" y="607" font-size="22" fill="#1A1916" font-weight="600" text-anchor="end">+</text>
<text x="322" y="607" font-size="22" fill="#1A1916" font-weight="600">−</text>
</svg>
