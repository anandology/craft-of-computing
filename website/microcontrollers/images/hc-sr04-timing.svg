<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-label="A timing diagram with three rows. Trig: the program holds it high for 10 microseconds. Sound: just after, the sensor sends a short burst of sound, and later a weaker echo comes back. Echo: it goes high when the burst has gone out and low when the echo comes back, so the length of the Echo pulse is the time the sound took to travel there and back." font-family="'IBM Plex Sans', system-ui, sans-serif">
