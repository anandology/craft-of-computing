[project]
name = "craft-of-computing"
version = "0.1.0"
description = "Tools for the Craft of Computing course"
requires-python = ">=3.10"
dependencies = [
    "flask",
    "gunicorn",  # what serves the app on the course server
    "markdown",  # quiz questions and options are written in markdown
]

[project.scripts]
sketch = "craft.sketch:main"
live-sketch = "craft.live_sketch:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=7",
]
