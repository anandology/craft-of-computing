[project]
name = "craft-of-computing"
version = "0.1.0"
description = "Tools for the Craft of Computing course"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
sketch = "craft.sketch:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
